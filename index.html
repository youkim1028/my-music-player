<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 음원">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>내 음원</title>
<style>
  :root {
    --bg: #111318; --panel: #1b1e26; --line: #2a2e39;
    --text: #f2f3f5; --sub: #9aa0ad; --accent: #4f8cff; --danger: #ff5d5d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 22px; margin: 0; flex: 1; }
  header .info { font-size: 12px; color: var(--sub); display: block; font-weight: 400; margin-top: 2px; }
  .pill {
    padding: 8px 14px; border-radius: 999px; background: var(--panel);
    font-size: 14px; border: 1px solid var(--line);
  }
  .pill.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .pill.on { border-color: var(--accent); color: var(--accent); }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  #list li .num { width: 24px; text-align: center; color: var(--sub); font-size: 13px; flex: none; }
  #list li .meta { flex: 1; min-width: 0; }
  #list li .title { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list li .artist { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  #list li.current .title, #list li.current .num { color: var(--accent); font-weight: 600; }
  #list li .tools { display: none; gap: 6px; flex: none; }
  body.editing #list li .tools { display: flex; }
  .tool { width: 36px; height: 36px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }
  .tool.del { color: var(--danger); }

  #empty { padding: 60px 28px; text-align: center; color: var(--sub); line-height: 1.7; }
  #empty b { color: var(--text); display: block; font-size: 18px; margin-bottom: 8px; }
  #empty .pill { margin-top: 20px; font-size: 16px; padding: 12px 22px; color: #fff; }

  #status { text-align: center; font-size: 13px; color: var(--sub); padding: 8px; min-height: 0; }
  #status:empty { display: none; }

  footer {
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
  }
  #nowTitle { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowArtist { font-size: 13px; color: var(--sub); margin-top: 2px; min-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #seek { width: 100%; margin: 12px 0 2px; accent-color: var(--accent); }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .ctl { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--text); }
  .ctl svg { width: 28px; height: 28px; fill: currentColor; }
  .ctl.small { color: var(--sub); position: relative; }
  .ctl.small svg { width: 22px; height: 22px; }
  .ctl.small.on { color: var(--accent); }
  .ctl.main { width: 64px; height: 64px; background: var(--text); color: var(--bg); }
  .ctl.main svg { width: 32px; height: 32px; }
  #repeatBadge { position: absolute; right: 8px; top: 8px; font-size: 10px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>내 음원<span class="info" id="info"></span></h1>
  <button class="pill" id="editBtn">편집</button>
  <button class="pill primary" id="addBtn">+ 추가</button>
</header>

<main>
  <div id="status"></div>
  <ul id="list"></ul>
  <div id="empty" hidden>
    <b>저장된 음원이 없습니다</b>
    '파일' 앱에 다운로드한 음원을 여러 개 선택하여 가져오면,<br>
    이 앱 안에 저장되어 순서대로 계속 재생됩니다.
    <div><button class="pill primary" id="addBtn2">음원 가져오기</button></div>
  </div>
</main>

<footer>
  <div id="nowTitle">재생할 곡을 선택하세요</div>
  <div id="nowArtist"></div>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
  <div class="controls">
    <button class="ctl small" id="shuffleBtn" aria-label="셔플">
      <svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1z"/></svg>
    </button>
    <button class="ctl" id="prevBtn" aria-label="이전 곡">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctl main" id="playBtn" aria-label="재생">
      <svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctl" id="nextBtn" aria-label="다음 곡">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button class="ctl small" id="repeatBtn" aria-label="반복">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      <span id="repeatBadge"></span>
    </button>
  </div>
</footer>

<input type="file" id="picker" multiple hidden
       accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.aiff,.caf">
<audio id="audio" preload="auto" playsinline></audio>

<script src="app.js"></script>
</body>
</html>
